<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add User | Volt Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Wrap in admin-page to apply the gradient, font, and animations -->
<div class="admin-page">

  <div class="admin-container">

    <h2>Add User</h2>
    <p>Fill out the form below to add a new user</p>

    <form class="admin-form" id="addUserForm">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email" required>

      <label for="role">Role</label>
      <select id="role" required>
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit" class="add-btn">Add User</button>
    </form>

    <a href="admin.html" class="back-link">Back to Dashboard</a>

  </div>

</div>
</body>
</html>
