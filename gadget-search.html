<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Volt Vault Gadget Finder</title>
<style>
body {
  font-family: 'Poppins', Arial, sans-serif;
  text-align: center;
  padding: 40px;
  background: linear-gradient(-45deg, #c77dff, #6a0dad, #b87cca, #7b2cbf);
  background-size: 400% 400%;
  animation: gradientMove 15s ease infinite;
  color: white;
}
@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
input, button {
  padding: 12px 18px;
  border-radius: 8px;
  border: none;
  margin: 10px;
}
button {
  background: linear-gradient(135deg,#ffffff,#e6ccff);
  color: #4b1c6f;
  cursor: pointer;
  transition: 0.3s ease;
}
button:hover {
  background: linear-gradient(135deg,#d7b3ff,#b87cca);
  color: white;
}
.results {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
}
.card {
  width: 220px;
  padding: 20px;
  border-radius: 16px;
  background: linear-gradient(135deg,#f6f0ff,#ffffff);
  color: #333;
  text-align: left;
  cursor: pointer;
}
.card img {
  width: 100%;
  border-radius: 8px;
  margin-bottom: 10px;
}
.card h3 {
  color: #6a0dad;
  margin-bottom: 6px;
}
.card button {
  margin-top: 10px;
  width: 100%;
  cursor: pointer;
}
.back-home-btn {
  display: inline-block;
  margin-top: 20px;
  padding: 14px 32px;
  background: linear-gradient(135deg, #6a0dad, #b87cca);
  color: white;
  text-decoration: none;
  font-weight: 500;
  border-radius: 30px;
  transition: 0.3s ease;
}
.back-home-btn:hover {
  transform: translateY(-5px);
  opacity: 0.9;
}
/* CATEGORY TITLES */
.category-title {
  margin-top: 40px;
  font-size: 24px;
  font-weight: bold;
}
/* MODAL */
#modal {
  display: none;
  position: fixed;
  z-index: 999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.8);
}
#modal-content {
  background: #fff;
  color: #333;
  margin: 10% auto;
  padding: 20px;
  border-radius: 16px;
  width: 90%;
  max-width: 600px;
  position: relative;
}
#closeModal {
  position: absolute;
  top: 10px;
  right: 20px;
  font-size: 28px;
  font-weight: bold;
  color: #333;
  cursor: pointer;
}
#carousel {
  margin-top: 20px;
}
.carousel-nav {
  margin-top: 10px;
}
.carousel-nav button {
  padding: 8px 16px;
  margin: 0 5px;
  border: none;
  border-radius: 8px;
  background: #6a0dad;
  color: white;
  cursor: pointer;
}
.carousel-nav button:hover {
  background: #b87cca;
}
</style>
</head>
<body>

<h1>Volt Vault Gadget Finder</h1>
<p>Search phones, laptops, tablets, smartwatches, headphones, and more.</p>

<!-- SEARCH -->
<input type="text" id="searchInput" placeholder="Search gadgets (Samsung, iPhone, Tablet...)">
<button id="searchBtn">Search</button>

<!-- SAVED -->
<a href="saved.html" class="back-home-btn">💾 Saved Gadgets</a>

<!-- SEARCH RESULTS -->
<div id="results" class="results"></div>

<!-- DEFAULT CATEGORIES -->
<h2 class="category-title">Smartphones</h2>
<div id="smartphones" class="results"></div>

<h2 class="category-title">Laptops</h2>
<div id="laptops" class="results"></div>

<h2 class="category-title">Accessories</h2>
<div id="accessories" class="results"></div>

<!-- MODAL FOR GADGET DETAILS -->
<div id="modal">
  <div id="modal-content">
    <span id="closeModal">&times;</span>
    <div id="carousel"></div>
    <div class="carousel-nav">
      <button id="prevSlide">Prev</button>
      <button id="nextSlide">Next</button>
    </div>
  </div>
</div>

<!-- JS -->
<script src="gadget.js"></script>

</body>
</html>
